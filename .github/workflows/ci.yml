name: checks

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit and socket integration tests
        run: python -m unittest discover -s tests -v
      - name: Build container image
        run: docker build -t framed-tcp-lab:ci .
